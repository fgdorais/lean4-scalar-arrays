name: Publish Docs

# Regenerates the docs from the chosen branch or tag, without making a release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false

      - name: Build Docs
        working-directory: docs
        run: lake build --keep-toolchain ScalarArray:docs

      # GitHub Pages serves the `docs` branch. The generated files are ignored on `main`, hence `-f`.
      - name: Deploy Docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b docs
          git add -f docs/doc docs/doc-data
          git commit -m "chore: generate docs for ${{ github.ref_name }}"
          git push origin docs --force
