name: Benchmarks

# Runs only on request: from the Actions tab, or by adding the `benchmark` label to a pull request.
# Times the benchmarks, counts the instructions and allocations of each probe call with valgrind,
# and compares the C code of the probes, in the head and, if there is one, the base. It only
# reports: the results are in the run's summary.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Branch, tag or commit to compare with (empty for no comparison)"
        required: false
        default: ""
  pull_request:
    types: [labeled]

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: install Lean
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: false

      - name: install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: build head
        run: |
          lake build bench probes
          cp .lake/build/bin/bench "$RUNNER_TEMP/bench-head"

      # The base is built with the head's benchmark source, so both run the same benchmarks.
      - name: build base
        id: base
        if: env.BASE != ''
        continue-on-error: true
        run: |
          scripts/bench_base.sh "$BASE" "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base"
          lake build bench probes
          cp .lake/build/bin/bench "$RUNNER_TEMP/bench-base"

      - name: run
        run: |
          {
            echo "## Benchmarks"
            echo
            "$RUNNER_TEMP/bench-head"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -x "$RUNNER_TEMP/bench-base" ]; then
            # Alternate the two builds, so that drift in the runner's speed affects both alike.
            for _ in 1 2 3 4 5; do
              "$RUNNER_TEMP/bench-base" --tsv >> "$RUNNER_TEMP/base.tsv"
              "$RUNNER_TEMP/bench-head" --tsv >> "$RUNNER_TEMP/head.tsv"
            done
            {
              echo
              echo "## Compared with \`$BASE\`"
              echo
              python3 scripts/bench_compare.py "$RUNNER_TEMP/base.tsv" "$RUNNER_TEMP/head.tsv"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$BASE" ]; then
            echo "The base \`$BASE\` could not be built with this benchmark." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: count
        run: |
          python3 scripts/bench_counts.py run .lake/build/bin/probes \
            > "$RUNNER_TEMP/head-counts.tsv"
          {
            echo
            echo "## Instructions and allocations per probe call"
            echo
            if [ -x "$RUNNER_TEMP/bench-base" ]; then
              python3 scripts/bench_counts.py run "$RUNNER_TEMP/base/.lake/build/bin/probes" \
                > "$RUNNER_TEMP/base-counts.tsv"
              echo "Compared with \`$BASE\`."
              echo
              python3 scripts/bench_counts.py compare "$RUNNER_TEMP/base-counts.tsv" \
                "$RUNNER_TEMP/head-counts.tsv"
              echo
              echo "## C code of the probes"
              echo
              python3 scripts/codegen_check.py "$RUNNER_TEMP/base"
            else
              echo "| Probe | Size | Instructions | Allocations | Arrays and closures |"
              echo "|---|--:|--:|--:|--:|"
              sed 's/\t/ | /g; s/^/| /; s/$/ |/' "$RUNNER_TEMP/head-counts.tsv"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
