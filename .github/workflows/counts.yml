name: Counts

# Counts the instructions and allocations of each probe call, with valgrind, in the base and the
# head of a pull request, and fails if a probe makes more allocations per call or runs more than 5%
# more instructions. The counts are exact, so they don't depend on the runner's speed.
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      base:
        description: "Branch, tag or commit to compare with"
        required: true
        default: "main"

concurrency:
  group: counts-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  counts:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: install Lean
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: false

      - name: install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: build head
        run: lake build probes

      # The base is built with the head's probes, so both count the same calls.
      - name: build base
        id: base
        continue-on-error: true
        run: |
          scripts/bench_base.sh "$BASE" "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base"
          lake build probes

      - name: count
        run: |
          python3 scripts/bench_counts.py run .lake/build/bin/probes > "$RUNNER_TEMP/head.tsv"
          {
            echo "## Counts per call"
            echo
            if [ "${{ steps.base.outcome }}" != "success" ]; then
              echo "The base \`$BASE\` could not be built with these probes."
              exit 0
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/bench_counts.py run "$RUNNER_TEMP/base/.lake/build/bin/probes" \
            > "$RUNNER_TEMP/base.tsv"
          status=0
          python3 scripts/bench_counts.py compare "$RUNNER_TEMP/base.tsv" "$RUNNER_TEMP/head.tsv" \
            > "$RUNNER_TEMP/compare.md" || status=$?
          {
            echo "Compared with \`$BASE\`."
            echo
            cat "$RUNNER_TEMP/compare.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/compare.md"
          exit $status
