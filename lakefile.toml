name = "«lean4-scalar-arrays»"
defaultTargets = ["ScalarArray", "ScalarArrayTest", "bench"]
testDriver = "ScalarArrayTest"

# Linters that are off by default.
leanOptions = { linter.missingDocs = true, linter.extra = true }

[[lean_lib]]
name = "ScalarArray"
# `ScalarArray.Bytes` and `ScalarArray.InPlaceSyntax` are experimental, so the root module doesn't
# import them, but they are built, precompiled and documented with the rest.
roots = ["ScalarArray", "ScalarArray.Bytes", "ScalarArray.InPlaceSyntax"]
# Lets the interpreter run the `extern` C code in downstream files, for `#eval` and `#guard`.
precompileModules = true
# Aligns loops to 64 bytes, so that a loop's speed doesn't depend on where unrelated code shifts it.
# Benchmarked across code layouts, the same loop varied by up to 1.5x without it and by about 1%
# with it, at no cost in average speed.
moreLeancArgs = ["-falign-loops=64"]

[[lean_lib]]
name = "ScalarArrayTest"
precompileModules = true

[[lean_exe]]
name = "bench"
root = "ScalarArrayBench"
# As for `ScalarArray`, since the benchmarked loops are mostly inlined here.
moreLeancArgs = ["-falign-loops=64"]
