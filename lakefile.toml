name = "«lean4-scalar-arrays»"
version = "1.0.0"
defaultTargets = ["ScalarArray", "ScalarArrayTest", "bench"]
testDriver = "ScalarArrayTest"

# Linters that are off by default.
leanOptions = { linter.missingDocs = true, linter.extra = true }

[[lean_lib]]
name = "ScalarArray"
# All modules, including the experimental `ScalarArray.Bytes` that the root does not import.
globs = ["ScalarArray", "ScalarArray.+"]
# Lets the interpreter run the `extern` C code in downstream files, for `#eval` and `#guard`.
precompileModules = true

[[lean_lib]]
name = "ScalarArrayTest"
precompileModules = true

[[lean_exe]]
name = "bench"
root = "ScalarArrayBench"
