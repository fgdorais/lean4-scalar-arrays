name = "«lean4-scalar-arrays»"
defaultTargets = ["ScalarArray", "ScalarArrayTest", "bench", "probes"]
testDriver = "ScalarArrayTest"

# Linters that are off by default.
leanOptions = { linter.missingDocs = true, linter.extra = true }

[[lean_lib]]
name = "ScalarArray"
# The root module doesn't import `ScalarArray.Bytes`, which is experimental, or
# `ScalarArray.Notation`, which makes `inplace` a keyword, but they are built, precompiled and
# documented with the rest.
roots = ["ScalarArray", "ScalarArray.Bytes", "ScalarArray.Notation"]
# Lets the interpreter run the `extern` C code in downstream files, for `#eval` and `#guard`.
precompileModules = true
# Aligns loops to 64 bytes, so that a loop's speed doesn't depend on where unrelated code shifts it.
# Benchmarked across code layouts, the same loop varied by up to 1.5x without it and by about 1%
# with it, at no cost in average speed.
moreLeancArgs = ["-falign-loops=64"]

[[lean_lib]]
name = "ScalarArrayTest"
precompileModules = true

# The probes, which `bench` and `probes` call; a library of their own, so that they are compiled
# apart from the code that calls them, as in a downstream package.
[[lean_lib]]
name = "ScalarArrayProbes"
roots = ["ScalarArrayBench.Probes"]
moreLeancArgs = ["-falign-loops=64"]

[[lean_exe]]
name = "bench"
root = "ScalarArrayBench"
# As for `ScalarArray`, since the benchmarked loops are mostly inlined here.
moreLeancArgs = ["-falign-loops=64"]

[[lean_exe]]
name = "probes"
root = "ScalarArrayBench.Driver"
# As for `bench`.
moreLeancArgs = ["-falign-loops=64"]
